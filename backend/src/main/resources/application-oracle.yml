# Oracle profile — activate with --spring.profiles.active=oracle
# Override DB_URL, DB_USERNAME, and DB_PASSWORD for your Oracle service.
# DB_SCHEMA is the schema that owns the application tables.
# Example URL: jdbc:oracle:thin:@//db-host.example.com:1521/FREEPDB1

app:
  datasource:
    schema: ${DB_SCHEMA:STP_KAFKA_HC_MISSION_CONTROL}
    table-prefix: ${DB_TABLE_PREFIX:STP_Kafka_HC_}

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:STP_KAFKA_HC_MISSION_CONTROL}
    password: ${DB_PASSWORD:mission_control}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      connection-init-sql: "ALTER SESSION SET CURRENT_SCHEMA=${app.datasource.schema}"
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        table_prefix: ${app.datasource.table-prefix}
        default_schema: ${app.datasource.schema}
        format_sql: true
